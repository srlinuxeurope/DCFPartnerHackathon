routing-policy {
    policy local {
        default-action {
            policy-result reject
        }
        statement loopback {
            match {
                protocol local
            }
            action {
                policy-result accept
            }
        }
    }
}
tunnel-interface vxlan1 {
    vxlan-interface 11 {
        type bridged
        ingress {
            vni 11
        }
    }
    vxlan-interface 1101 {
        type bridged
        ingress {
            vni 1101
        }
    }
    vxlan-interface 1201 {
        type routed
        ingress {
            vni 201
        }
        egress {
            source-ip use-system-ipv4-address
        }
    }
}
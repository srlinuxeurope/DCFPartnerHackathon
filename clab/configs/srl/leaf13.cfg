system {
    network-instance {
        protocols {
            evpn {
                ethernet-segments {
                    bgp-instance 1 {
                        ethernet-segment ES-12 {
                            admin-state enable
                            esi 01:DC:01:12:12:12:12:00:00:01
                            multi-homing-mode all-active
                            interface lag1 {
                            }
                        }
                    }
                }
            }
            bgp-vpn {
                bgp-instance 1 {
                }
            }
        }
    }
}
network-instance default {
    type default
    ip-forwarding {
        receive-ipv4-check false
        receive-ipv6-check false
    }
    interface ethernet-1/31.0 {
    }
    interface ethernet-1/32.0 {
    }
    interface system0.0 {
    }
    interface irb0.1 {
    }
    protocols {
        bgp {
            autonomous-system 4200001003
            router-id 10.46.${INSTANCE_ID}.35
            dynamic-neighbors {
                interface ethernet-1/31.0 {
                    peer-group spine
                    allowed-peer-as [
                        4200001000
                    ]
                }
                interface ethernet-1/32.0 {
                    peer-group spine
                    allowed-peer-as [
                        4200001000
                    ]
                }
            }
            ebgp-default-policy {
                import-reject-all false
                export-reject-all false
            }
            afi-safi evpn {
                evpn {
                    rapid-update true
                }
                multipath {
                    allow-multiple-as true
                    ebgp {
                        maximum-paths 64
                    }
                    ibgp {
                        maximum-paths 64
                    }
                }
            }
            afi-safi ipv4-unicast {
                admin-state enable
                multipath {
                    allow-multiple-as true
                    ebgp {
                        maximum-paths 32
                    }
                    ibgp {
                        maximum-paths 32
                    }
                }
                ipv4-unicast {
                    advertise-ipv6-next-hops true
                    receive-ipv6-next-hops true
                }
            }
            afi-safi ipv6-unicast {
                admin-state enable
                multipath {
                    allow-multiple-as true
                    ebgp {
                        maximum-paths 32
                    }
                    ibgp {
                        maximum-paths 32
                    }
                }
            }
            transport {
                mtu-discovery true
            }
            group iBGP-DC {
                next-hop-self true
                peer-as 65000
                afi-safi evpn {
                    admin-state enable
                }
                afi-safi ipv4-unicast {
                    admin-state disable
                }
                afi-safi ipv6-unicast {
                    admin-state disable
                }
                local-as {
                    as-number 65000
                    prepend-global-as false
                }
                timers {
                    connect-retry 1
                    minimum-advertisement-interval 1
                }
                transport {
                    local-address 10.46.${INSTANCE_ID}.35
                }
            }
            group spine {
                export-policy [ local ]
            }
            neighbor fd00:fde8::${INSTANCE_ID}:22 {
                peer-group iBGP-DC
            }
        }
    }
}

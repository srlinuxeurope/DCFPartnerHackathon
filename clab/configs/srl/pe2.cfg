            admin-state enable
            address 10.46.${INSTANCE_ID}.22/32 {
            }
        }
        ipv6 {
            admin-state enable
            address fd00:fde8::${INSTANCE_ID}:22/128 {
            }
        }
    }
}
routing-policy {
    policy iBGP-redist {
        default-action {
            policy-result reject
        }
        statement local {
            match {
                protocol local
            }
            action {
                policy-result accept
            }
        }
        statement fabric {
            match {
                protocol bgp
            }
            action {
                policy-result accept
            }
        }
    }
    policy local {
        statement loopback {
            match {
                protocol local
            }
            action {
                policy-result accept
            }
        }
    }
}
network-instance default {
    type default
    mpls-forwarding {
        forward-received-packets true
    }
    ip-forwarding {
        receive-ipv4-check false
        receive-ipv6-check false
    }
    interface ethernet-1/1.0 {
    }
    interface ethernet-1/2.0 {
    }
    interface ethernet-1/3.0 {
    }
    interface irb0.1 {
    }
    interface system0.0 {
    }
    protocols {
        bgp {
            autonomous-system 65000
            router-id 10.46.${INSTANCE_ID}.22
            dynamic-neighbors {
                accept {
                    match fd00:fde8::/96 {
                        peer-group iBGP-DC
                        allowed-peer-as [
                            65000
                        ]
                    }
                }
                interface ethernet-1/2.0 {
                    peer-group dc1
                    allowed-peer-as [
                        4200001000
                    ]
                }
                interface ethernet-1/3.0 {
                    peer-group dc1
                    allowed-peer-as [
                        4200001000
                    ]
                }
            }
            ebgp-default-policy {
                import-reject-all false
                export-reject-all false
            }
            afi-safi evpn {
                evpn {
                    rapid-update true
                }
                multipath {
                    allow-multiple-as true
                    ebgp {
                        maximum-paths 64
                    }
                    ibgp {
                        maximum-paths 64
                    }
                }
            }
            afi-safi ipv4-unicast {
                admin-state enable
                multipath {
                    allow-multiple-as true
                    ebgp {
                        maximum-paths 32
                    }
                    ibgp {
                        maximum-paths 32
                    }
                }
                ipv4-unicast {
                    advertise-ipv6-next-hops true
                    receive-ipv6-next-hops true
                }
            }
            afi-safi ipv6-unicast {
                admin-state enable
                multipath {
                    allow-multiple-as true
                    ebgp {
                        maximum-paths 32
                    }
                    ibgp {
                        maximum-paths 32
                    }
                }
            }
            transport {
                mtu-discovery true
            }
            group dc1 {
                export-policy [ local ]
                send-default-route {
                    ipv4-unicast true
                    ipv6-unicast true
                }
            }
            group iBGP-CORE {
                peer-as 65000
                next-hop-self true
                export-policy [ iBGP-redist ]
                afi-safi evpn {
                    admin-state disable
                }
                afi-safi ipv4-unicast {
                    admin-state enable
                }
                afi-safi ipv6-unicast {
                    admin-state enable
                }
                timers {
                    connect-retry 1
                }
            }
            group iBGP-DC {
                peer-as 65000
                afi-safi evpn {
                    admin-state enable
                }
                afi-safi ipv4-unicast {
                    admin-state disable
                }
                afi-safi ipv6-unicast {
                    admin-state disable
                }
                route-reflector {
                    client true
                    cluster-id 10.46.${INSTANCE_ID}.22
                }
            }
            neighbor fd00:fde8:0:1:${INSTANCE_ID}:22:24:1 {
                admin-state enable
                peer-group iBGP-CORE
            }
            neighbor fd00:fde8::${INSTANCE_ID}:24 {
                admin-state enable
                peer-group iBGP-DC
            }
        }
        isis {
            dynamic-label-block sr-labels
            instance core {
                admin-state enable
                level-capability L2
                net [
                    49.0000.1046.${CNSP_INSTANCE_ID}.0022.00
                ]
                ipv4-unicast {
                    admin-state enable
                }
                ipv6-unicast {
                    admin-state enable
                    multi-topology false
                }
                loopfree-alternate {
                    admin-state enable
                    remote-lfa {
                        admin-state enable
                    }
                }
                segment-routing {
                    mpls {
                        dynamic-adjacency-sids {
                            all-interfaces true
                        }
                    }
                }
                interface ethernet-1/1.0 {
                    circuit-type point-to-point
                }
                interface system0.0 {
                    passive true
                    segment-routing {
                        mpls {
                            ipv4-node-sid {
                                index 22
                            }
                            ipv6-node-sid {
                                index 122
                            }
                        }
                    }
                }
            }
        }
    }
    segment-routing {
        mpls {
            global-block {
                label-range static
            }
        }
    }
    mpls {
    }
}
network-instance macvrf-dns {
    type mac-vrf
    admin-state enable
    interface ethernet-1/4.0 {
    }
    interface irb0.1 {
    }
}
network-instance dci {
    type ip-vrf
    admin-state enable
    description "DCI ip-vrf - EVPN-VXLAN to DC1 (evi 201) + EVPN-IFL MPLS to remote PE (evi 300)"
    vxlan-interface vxlan1.201 {
    }
    protocols {
        bgp-evpn {
            bgp-instance 1 {
                admin-state enable
                vxlan-interface vxlan1.201
                evi 201
                ecmp 8
                dpath-domain-id 65000:1201
                multi-homing-mode access
            }
            bgp-instance 2 {
                admin-state enable
                encapsulation-type mpls
                evi 300
                dpath-domain-id 65000:300
                multi-homing-mode network
                mpls {
                    next-hop-resolution {
                        allowed-tunnel-types [ sr-isis ]
                    }
                }
            }
        }
        bgp-vpn {
            allow-export {
            }
            bgp-instance 1 {
                route-target {
                    export-rt target:65000:1201
                    import-rt target:65000:1201
                }
            }
            bgp-instance 2 {
                route-target {
                    export-rt target:65000:300
                    import-rt target:65000:300
                }
            }
        }
    }
}
tunnel-interface vxlan1 {
    vxlan-interface 201 {
        type routed
        ingress {
            vni 201
        }
        egress {
            source-ip use-system-ipv4-address
        }
    }
}
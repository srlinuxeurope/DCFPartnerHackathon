interface ethernet-1/4 {
    description "link to DNS"
    admin-state enable
    vlan-tagging true
    subinterface 0 {
        type bridged
        l2-mtu 9022
        vlan {
            encap {
                single-tagged {
                    vlan-id 1
                }
            }
        }
    }
}
interface irb0 {
    admin-state enable
    subinterface 1 {

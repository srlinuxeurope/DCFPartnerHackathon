        ip-mtu 9000
        ipv4 {
            admin-state enable
            address 10.64.13.129/25 {
                primary
            }
        }
        ipv6 {
            admin-state enable
            address fd00:fde8:0:13::1/64 {
                primary
            }
        }
    }
}
interface system0 {
    admin-state enable
    subinterface 0 {
        admin-state enable

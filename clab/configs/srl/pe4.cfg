routing-policy {
    policy iBGP-redist {
        default-action {
            policy-result reject
        }
        statement local {
            match {
                protocol local
            }
            action {
                policy-result accept
            }
        }
        statement fabric {
            match {
                protocol bgp
            }
            action {
                policy-result accept
            }
        }
    }
    policy local {
        statement loopback {
            match {
                protocol local
            }
            action {
                policy-result accept
            }
        }
    }
}
network-instance default {
    type default
    mpls-forwarding {
        forward-received-packets true
    }
    ip-forwarding {
        receive-ipv4-check false
        receive-ipv6-check false
    }
    interface ethernet-1/1.0 {
    }
    interface ethernet-1/2.0 {
    }
    interface ethernet-1/3.0 {
    }
    interface ethernet-1/4.0 {
    }
    interface system0.0 {
    }
    protocols {
        bgp {
            autonomous-system 65000
            router-id 10.46.${INSTANCE_ID}.24
            dynamic-neighbors {
                accept {
                    match fd00:fde8::/96 {
                        peer-group iBGP-DC
                        allowed-peer-as [
                            65000
                        ]
                    }
                }
                interface ethernet-1/2.0 {
                    peer-group dc2
                    allowed-peer-as [
                        4200002000
                    ]
                }
                interface ethernet-1/3.0 {
                    peer-group dc2
                    allowed-peer-as [
                        4200002000
                    ]
                }
            }
            ebgp-default-policy {
                import-reject-all false
                export-reject-all false
            }
            afi-safi evpn {
                evpn {
                    rapid-update true
                }
                multipath {
                    allow-multiple-as true
                    ebgp {
                        maximum-paths 64
                    }
                    ibgp {
                        maximum-paths 64
                    }
                }
            }
            afi-safi ipv4-unicast {
                admin-state enable
                multipath {
                    allow-multiple-as true
                    ebgp {
                        maximum-paths 32
                    }
                    ibgp {
                        maximum-paths 32
                    }
                }
                ipv4-unicast {
                    advertise-ipv6-next-hops true
                    receive-ipv6-next-hops true
                }
            }
            afi-safi ipv6-unicast {
                admin-state enable
                multipath {
                    allow-multiple-as true
                    ebgp {
                        maximum-paths 32
                    }
                    ibgp {
                        maximum-paths 32
                    }
                }
            }
            afi-safi l3vpn-ipv4-unicast {
                admin-state enable
            }
            afi-safi l3vpn-ipv6-unicast {
                admin-state enable
            }
            transport {
                mtu-discovery true
            }
            group dc2 {
                export-policy [ local ]
                send-default-route {
                    ipv4-unicast true
                    ipv6-unicast true
                }
            }
            group iBGP-CORE {
                peer-as 65000
                next-hop-self true
                export-policy [ iBGP-redist ]
                afi-safi evpn {
                    admin-state disable
                }
                afi-safi l3vpn-ipv4-unicast {
                    admin-state disable
                }
                afi-safi l3vpn-ipv6-unicast {
                    admin-state disable
                }
                afi-safi ipv4-unicast {
                    admin-state enable
                    ipv4-unicast {
                        advertise-ipv6-next-hops true
                        receive-ipv6-next-hops true
                    }
                }
                afi-safi ipv6-unicast {
                    admin-state enable
                }
                timers {
                    connect-retry 1
                }
            }
            group iBGP-WAN {
                peer-as 65000
                afi-safi evpn {
                    admin-state disable
                }
                afi-safi ipv4-unicast {
                    admin-state disable
                }
                afi-safi ipv6-unicast {
                    admin-state disable
                }
                afi-safi l3vpn-ipv4-unicast {
                    admin-state enable
                }
                afi-safi l3vpn-ipv6-unicast {
                    admin-state enable
                }
                timers {
                    connect-retry 1
                }
            }
            group iBGP-DC {
                peer-as 65000
                afi-safi evpn {
                    admin-state enable
                }
                afi-safi ipv4-unicast {
                    admin-state disable
                }
                afi-safi ipv6-unicast {
                    admin-state disable
                }
                afi-safi l3vpn-ipv4-unicast {
                    admin-state disable
                }
                afi-safi l3vpn-ipv6-unicast {
                    admin-state disable
                }
                route-reflector {
                    client true
                    cluster-id 10.46.${INSTANCE_ID}.24
                }
            }
            neighbor fd00:fde8:0:1:${INSTANCE_ID}:22:24:0 {
                admin-state enable
                peer-group iBGP-CORE
                transport {
                    local-address fd00:fde8:0:1:${INSTANCE_ID}:22:24:1
                }
            }
            neighbor 10.46.${INSTANCE_ID}.22 {
                admin-state enable
                peer-group iBGP-WAN
                transport {
                    local-address 10.46.${INSTANCE_ID}.24
                }
            }
            neighbor fd00:fde8::${INSTANCE_ID}:22 {
                admin-state enable
                peer-group iBGP-DC
            }
        }
        ospf {
            instance wan-v4 {
                admin-state enable
                version ospf-v2
                router-id 10.46.${INSTANCE_ID}.24
                area 0.0.0.0 {
                    interface ethernet-1/1.0 {
                        admin-state enable
                        interface-type point-to-point
                    }
                    interface ethernet-1/4.0 {
                        admin-state enable
                        passive true
                    }
                    interface system0.0 {
                        admin-state enable
                        passive true
                    }
                }
            }
            instance wan-v6 {
                admin-state enable
                version ospf-v3
                address-family ipv6-unicast
                router-id 10.46.${INSTANCE_ID}.24
                area 0.0.0.0 {
                    interface ethernet-1/1.0 {
                        admin-state enable
                        interface-type point-to-point
                    }
                    interface ethernet-1/4.0 {
                        admin-state enable
                        passive true
                    }
                    interface system0.0 {
                        admin-state enable
                        passive true
                    }
                }
            }
        }
        ldp {
            admin-state enable
            dynamic-label-block ldp
            discovery {
                interfaces {
                    interface ethernet-1/1.0 {
                        ipv4 {
                            admin-state enable
                        }
                    }
                }
            }
        }
    }
    mpls {
    }
}
network-instance dci {
    type ip-vrf
    admin-state enable
    description "DCI ip-vrf - EVPN-VXLAN to DC2 (evi 2201) + BGP-IPVPN MPLS/LDP to remote PE (RT 65000:300)"
    vxlan-interface vxlan1.2201 {
    }
    protocols {
        bgp-evpn {
            bgp-instance 1 {
                admin-state enable
                vxlan-interface vxlan1.2201
                evi 2201
                ecmp 8
            }
        }
        bgp-ipvpn {
            bgp-instance 2 {
                admin-state enable
                mpls {
                    next-hop-resolution {
                        allowed-tunnel-types [ ldp ]
                    }
                }
            }
        }
        bgp-vpn {
            allow-export {
            }
            bgp-instance 1 {
                route-target {
                    export-rt target:65000:2201
                    import-rt target:65000:2201
                }
            }
            bgp-instance 2 {
                route-target {
                    export-rt target:65000:300
                    import-rt target:65000:300
                }
            }
        }
    }
}
tunnel-interface vxlan1 {
    vxlan-interface 2201 {
        type routed
        ingress {
            vni 2201
        }
        egress {
            source-ip use-system-ipv4-address
        }
    }
}
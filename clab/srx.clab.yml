#
# Reduced topology (all Nokia SR Linux 26.7.1):
#   - DC1 (spine11/12, leaf11/12/13, client11-13) attached to PE2
#   - DC2 (spine21/22, leaf21/22/23, client21-23) attached to PE4
#   - PE2 and PE4 (type 7250 IXR-X1b) directly connected (e1-1 <-> e1-1,
#     10.64.20.0/31) and carrying the former P/vRR roles: ISIS+SR-MPLS core,
#     iBGP (ipv4/ipv6 over the link, EVPN RR mesh over loopbacks)
#   - RADIUS attached in-band to PE4 (e1-4), DNS to PE2 (e1-4, VLAN 1)
#     (former vRR attachment addressing preserved: 10.64.13.0/31 and 10.64.13.128/25)
#   - Telemetry & logging: gnmic/prometheus/grafana + promtail/loki (SRL-only;
#     the syslog-ng relay was removed with the SR OS nodes)
# Removed: p1, p2, vRR, pe1, pe3, client01-04, ixp1, agg1, peering2, transit1,
#          rpki, bngblaster and the pe*-p* bridge nodes. No SR OS nodes remain.

name: srexperts

mgmt:
  network: srexperts # management network name
  ipv4-subnet: 10.128.${INSTANCE_ID}.0/24 # ipv4 range

topology:
  defaults:
    kind: linux
    image: ghcr.io/srl-labs/network-multitool
    credentials:
      username: admin
      password: ${EVENT_PASSWORD}
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:26.7.1
      # startup-config is set explicitly on every SR Linux node below
      exec:
        - usermod -aG ntwkadmin admin

    linux:
      image: ghcr.io/srl-labs/network-multitool
      startup-delay: 120

  nodes:
    # core services
    radius:
      kind: linux
      group: core
      mgmt-ipv4: 10.128.${INSTANCE_ID}.14
      image: ghcr.io/srl-labs/network-multitool
      binds:
        - $HOME/.ssh/id_rsa.pub:/tmp/authorized_keys:ro
        - configs/radius/interfaces.tmpl:/etc/network/interfaces.tmpl
        - configs/radius/clients.tmpl.conf:/etc/raddb/clients.tmpl.conf
        - configs/radius/radiusd.conf:/etc/raddb/radiusd.conf
        - configs/radius/authorize:/etc/raddb/mods-config/files/authorize
        - configs/radius/radius.sh:/client.sh
        - configs/radius/dictionary:/usr/share/freeradius/dictionary
      exec:
        - bash -c "envsubst < /etc/network/interfaces.tmpl | tee /etc/network/interfaces"
        - bash -c "envsubst < /etc/raddb/clients.tmpl.conf | tee /etc/raddb/clients.conf"
        - bash /client.sh
        - bash -c "echo 'nameserver 10.128.${INSTANCE_ID}.15' | sudo tee /etc/resolv.conf"
      ports:
        - 50014:22
      env:
        USER_PASSWORD: ${EVENT_PASSWORD}
        INSTANCE_ID: ${INSTANCE_ID}
    dns:
      kind: linux
      group: core
      mgmt-ipv4: 10.128.${INSTANCE_ID}.15
      image: ghcr.io/srl-labs/network-multitool
      binds:
        - $HOME/.ssh/id_rsa.pub:/tmp/authorized_keys:ro
        - configs/dns/interfaces:/etc/network/interfaces
        - configs/dns/dns.sh:/client.sh
        - configs/dns/dnsmasq.tmpl.conf:/etc/dnsmasq.tmpl.conf
      exec:
        - bash -c "envsubst < /etc/dnsmasq.tmpl.conf | tee /etc/dnsmasq.d/dns.conf"
        - bash /client.sh
      ports:
        - 50015:22
      env:
        USER_PASSWORD: ${EVENT_PASSWORD}
        INSTANCE_ID: ${INSTANCE_ID}
    # PE-layers (SR Linux 26.7.1, 7250 IXR-X1b)
    pe2:
      kind: nokia_srlinux
      license: /opt/srexperts/srl.license
      type: ixr-x1b
      mgmt-ipv4: 10.128.${INSTANCE_ID}.22
      startup-config: configs/srl/pe2.cfg
      ports:
        - 50022:22
        - 50322:57400
    pe4:
      kind: nokia_srlinux
      license: /opt/srexperts/srl.license
      type: ixr-x1b
      mgmt-ipv4: 10.128.${INSTANCE_ID}.24
      startup-config: configs/srl/pe4.cfg
      ports:
        - 50024:22
        - 50324:57400
    # DC1
    spine11:
      kind: nokia_srlinux
      type: ixr-d5
      group: spine
      mgmt-ipv4: 10.128.${INSTANCE_ID}.31
      startup-config: configs/srl/spine11.cfg
      ports:
        - 50031:22
        - 50331:57400
    spine12:
      kind: nokia_srlinux
      type: ixr-d5
      group: spine
      mgmt-ipv4: 10.128.${INSTANCE_ID}.32
      startup-config: configs/srl/spine12.cfg
      ports:
        - 50032:22
        - 50332:57400
    leaf11:
      kind: nokia_srlinux
      type: ixr-d3l
      group: leaf
      mgmt-ipv4: 10.128.${INSTANCE_ID}.33
      startup-config: configs/srl/leaf11.cfg
      ports:
        - 50033:22
        - 50333:57400
    leaf12:
      kind: nokia_srlinux
      type: ixr-d3l
      group: leaf
      mgmt-ipv4: 10.128.${INSTANCE_ID}.34
      startup-config: configs/srl/leaf12.cfg
      ports:
        - 50034:22
        - 50334:57400
    leaf13:
      kind: nokia_srlinux
      type: ixr-d3l
      group: leaf
      mgmt-ipv4: 10.128.${INSTANCE_ID}.35
      startup-config: configs/srl/leaf13.cfg
      ports:
        - 50035:22
        - 50335:57400
    client11:
      kind: linux
      group: dcclient
      mgmt-ipv4: 10.128.${INSTANCE_ID}.36
      image: ghcr.io/srl-labs/network-multitool
      binds:
        - $HOME/.ssh/id_rsa.pub:/tmp/authorized_keys:ro
        - configs/client/interfaces-client11:/etc/network/interfaces
        - configs/client/client.sh:/client.sh
        - configs/client/traffic.sh:/traffic.sh
      exec:
        - bash /client.sh
        - bash -c "echo 'nameserver 10.128.${INSTANCE_ID}.15' | sudo tee /etc/resolv.conf"
      ports:
        - 50036:22
      env:
        USER_PASSWORD: ${EVENT_PASSWORD}
    client12:
      kind: linux
      group: dcclient
      mgmt-ipv4: 10.128.${INSTANCE_ID}.37
      image: ghcr.io/srl-labs/network-multitool
      binds:
        - $HOME/.ssh/id_rsa.pub:/tmp/authorized_keys:ro
        - configs/client/interfaces-client12:/etc/network/interfaces
        - configs/client/client.sh:/client.sh
        - configs/client/traffic.sh:/traffic.sh
      exec:
        - bash /client.sh
        - bash -c "echo 'nameserver 10.128.${INSTANCE_ID}.15' | sudo tee /etc/resolv.conf"
      ports:
        - 50037:22
      env:
        USER_PASSWORD: ${EVENT_PASSWORD}
    client13:
      kind: linux
      group: dcclient
      mgmt-ipv4: 10.128.${INSTANCE_ID}.38
      image: ghcr.io/srl-labs/network-multitool
      binds:
        - $HOME/.ssh/id_rsa.pub:/tmp/authorized_keys:ro
        - configs/client/interfaces-client13:/etc/network/interfaces
        - configs/client/client.sh:/client.sh
        - configs/client/traffic.sh:/traffic.sh
      exec:
        - bash /client.sh
        - bash -c "echo 'nameserver 10.128.${INSTANCE_ID}.15' | sudo tee /etc/resolv.conf"
      ports:
        - 50038:22
      env:
        USER_PASSWORD: ${EVENT_PASSWORD}
    # DC2
    spine21:
      kind: nokia_srlinux
      type: ixr-d5
      group: spine
      mgmt-ipv4: 10.128.${INSTANCE_ID}.41
      startup-config: configs/srl/spine21.cfg
      ports:
        - 50041:22
        - 50341:57400
    spine22:
      kind: nokia_srlinux
      type: ixr-d5
      group: spine
      mgmt-ipv4: 10.128.${INSTANCE_ID}.42
      startup-config: configs/srl/spine22.cfg
      ports:
        - 50042:22
        - 50342:57400
    leaf21:
      kind: nokia_srlinux
      type: ixr-d3l
      group: leaf
      mgmt-ipv4: 10.128.${INSTANCE_ID}.43
      startup-config: configs/srl/leaf21.cfg
      ports:
        - 50043:22
        - 50343:57400
    leaf22:
      kind: nokia_srlinux
      type: ixr-d3l
      group: leaf
      mgmt-ipv4: 10.128.${INSTANCE_ID}.44
      startup-config: configs/srl/leaf22.cfg
      ports:
        - 50044:22
        - 50344:57400
    leaf23:
      kind: nokia_srlinux
      type: ixr-d3l
      group: leaf
      mgmt-ipv4: 10.128.${INSTANCE_ID}.45
      startup-config: configs/srl/leaf23.cfg
      ports:
        - 50045:22
        - 50345:57400
    client21:
      kind: linux
      group: dcclient
      mgmt-ipv4: 10.128.${INSTANCE_ID}.46
      image: ghcr.io/srl-labs/network-multitool
      binds:
        - $HOME/.ssh/id_rsa.pub:/tmp/authorized_keys:ro
        - configs/client/interfaces-client21:/etc/network/interfaces
        - configs/client/client.sh:/client.sh
        - configs/client/traffic.sh:/traffic.sh
      exec:
        - bash /client.sh
        - bash -c "echo 'nameserver 10.128.${INSTANCE_ID}.15' | sudo tee /etc/resolv.conf"
      ports:
        - 50046:22
      env:
        USER_PASSWORD: ${EVENT_PASSWORD}
    client22:
      kind: linux
      group: dcclient
      mgmt-ipv4: 10.128.${INSTANCE_ID}.47
      image: ghcr.io/srl-labs/network-multitool
      binds:
        - $HOME/.ssh/id_rsa.pub:/tmp/authorized_keys:ro
        - configs/client/interfaces-client22:/etc/network/interfaces
        - configs/client/client.sh:/client.sh
        - configs/client/traffic.sh:/traffic.sh
      exec:
        - bash /client.sh
        - bash -c "echo 'nameserver 10.128.${INSTANCE_ID}.15' | sudo tee /etc/resolv.conf"
      ports:
        - 50047:22
      env:
        USER_PASSWORD: ${EVENT_PASSWORD}
    client23:
      kind: linux
      group: dcclient
      mgmt-ipv4: 10.128.${INSTANCE_ID}.48
      image: ghcr.io/srl-labs/network-multitool
      binds:
        - $HOME/.ssh/id_rsa.pub:/tmp/authorized_keys:ro
        - configs/client/interfaces-client23:/etc/network/interfaces
        - configs/client/client.sh:/client.sh
        - configs/client/traffic.sh:/traffic.sh
      exec:
        - bash /client.sh
        - bash -c "echo 'nameserver 10.128.${INSTANCE_ID}.15' | sudo tee /etc/resolv.conf"
      ports:
        - 50048:22
      env:
        USER_PASSWORD: ${EVENT_PASSWORD}
    ### TELEMETRY STACK ###
    gnmic:
      kind: linux
      mgmt-ipv4: 10.128.${INSTANCE_ID}.71
      image: ghcr.io/openconfig/gnmic:0.43.0
      binds:
        - configs/gnmic/config.yml:/gnmic-config.yml:ro
        - /var/run/docker.sock:/var/run/docker.sock:ro
      cmd: --config /gnmic-config.yml --log subscribe
      group: "10" # group 10 is assigned to the nodes of a telemetry stack
      env:
        GNMIC_PASSWORD: ${EVENT_PASSWORD}
    prometheus:
      kind: linux
      mgmt-ipv4: 10.128.${INSTANCE_ID}.72
      image: quay.io/prometheus/prometheus:v2.54.1
      binds:
        - configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      ports:
        - 9090:9090
      cmd: --config.file=/etc/prometheus/prometheus.yml
      group: "10"

    grafana:
      kind: linux
      mgmt-ipv4: 10.128.${INSTANCE_ID}.73
      image: grafana/grafana:12.3.3
      binds:
        - configs/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
        - configs/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
        - configs/grafana/dashboards:/var/lib/grafana/dashboards
      ports:
        - 3000:3000
      env:
        # env vars to enable anonymous access
        GF_ORG_ROLE: "Admin"
        GF_ORG_NAME: "Main Org."
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
        GF_AUTH_ANONYMOUS: "true"
        GF_AUTH_OAUTH_AUTO_LOGIN: "true"
        GF_SECURITY_ADMIN_PASSWORD: ${EVENT_PASSWORD}
      cmd: "sh -c grafana cli admin reset-admin-password ${GF_SECURITY_ADMIN_PASSWORD} && /run.sh"
      group: "10"

    ### LOGGING STACK ###
    promtail:
      kind: linux
      mgmt-ipv4: 10.128.${INSTANCE_ID}.75
      image: grafana/promtail:3.5.10
      binds:
        - configs/promtail:/etc/promtail
      cmd: --config.file=/etc/promtail/promtail-config.yml
    loki:
      kind: linux
      mgmt-ipv4: 10.128.${INSTANCE_ID}.76
      image: grafana/loki:3.5.10
      binds:
        - configs/loki:/etc/loki
      cmd: --config.file=/etc/loki/loki-config.yml

  links:
    # DCI: direct PE2 <-> PE4 link (ISIS/SR-MPLS + iBGP + VXLAN handoff)
    - endpoints: ["pe2:e1-1", "pe4:e1-1"]
      mtu: 9500
    # in-band attachment of RADIUS (to PE4) and DNS (to PE2)
    # (former vRR subnets preserved: 10.64.13.0/31 and 10.64.13.128/25 vlan 1)
    - endpoints: ["pe4:e1-4", "radius:eth1"]
      mtu: 9500
    - endpoints: ["pe2:e1-4", "dns:eth1"]
      mtu: 9500
    # links from pe2 to DC1
    - endpoints: ["pe2:e1-2", "spine11:e1-32"]
      mtu: 9500
    - endpoints: ["pe2:e1-3", "spine12:e1-32"]
      mtu: 9500
    # links from pe4 to DC2
    - endpoints: ["pe4:e1-2", "spine21:e1-32"]
      mtu: 9500
    - endpoints: ["pe4:e1-3", "spine22:e1-32"]
      mtu: 9500
    # links from spine11/12 to leafs
    - endpoints: ["spine11:e1-1", "leaf11:e1-31"]
    - endpoints: ["spine11:e1-2", "leaf12:e1-31"]
    - endpoints: ["spine11:e1-3", "leaf13:e1-31"]
    - endpoints: ["spine12:e1-1", "leaf11:e1-32"]
    - endpoints: ["spine12:e1-2", "leaf12:e1-32"]
    - endpoints: ["spine12:e1-3", "leaf13:e1-32"]
    # links from leaf11/12/13 to clients
    - endpoints: ["leaf11:e1-1", "client11:eth1"]
    - endpoints: ["leaf11:e1-2", "client12:eth1"]
    - endpoints: ["leaf12:e1-2", "client12:eth2"]
    - endpoints: ["leaf13:e1-2", "client12:eth3"]
    - endpoints: ["leaf13:e1-3", "client13:eth1"]
    # links from spine21/22 to leafs
    - endpoints: ["spine21:e1-1", "leaf21:e1-31"]
    - endpoints: ["spine21:e1-2", "leaf22:e1-31"]
    - endpoints: ["spine21:e1-3", "leaf23:e1-31"]
    - endpoints: ["spine22:e1-1", "leaf21:e1-32"]
    - endpoints: ["spine22:e1-2", "leaf22:e1-32"]
    - endpoints: ["spine22:e1-3", "leaf23:e1-32"]
    # links from leaf21/22/23 to clients
    - endpoints: ["leaf21:e1-1", "client21:eth1"]
    - endpoints: ["leaf21:e1-2", "client22:eth1"]
    - endpoints: ["leaf22:e1-2", "client22:eth2"]
    - endpoints: ["leaf23:e1-2", "client22:eth3"]
    - endpoints: ["leaf23:e1-3", "client23:eth1"]

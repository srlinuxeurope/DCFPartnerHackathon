# --- Configlets IRB GRT ---
# this configlet creates a dedicated IRB for the MAC-VRF
# that need to be connected to the GRT. This is not
# supported yet in EDA
apiVersion: config.eda.nokia.com/v1alpha1
kind: Configlet
metadata:
  labels:
    role: hackathon-infra
  name: irb-grt
  namespace: eda
spec:
  configs:
    - config: |-
        {
            "name": "irb0",
            "subinterface": [
                {
                    "index": 1,
                    "description": "to-default-ni",
                    "ipv4": {
                        "admin-state": "enable",
                        "address": [
                            {
                                "ip-prefix": "10.64.30.1/24",
                                "anycast-gw": true
                            }
                        ],
                        "arp": {
                            "learn-unsolicited": true,
                            "evpn": {
                                "advertise": [
                                    {
                                        "route-type": "static"
                                    },
                                    {
                                        "route-type": "dynamic"
                                    }
                                ]
                            }
                        }
                    },
                    "ipv6": {
                        "admin-state": "enable",
                        "address": [
                            {
                                "ip-prefix": "fd00:fde8:0:30::1/64",
                                "anycast-gw": true
                            }
                        ],
                        "neighbor-discovery": {
                            "learn-unsolicited": "global",
                            "evpn": {
                                "advertise": [
                                    {
                                        "route-type": "static"
                                    },
                                    {
                                        "route-type": "dynamic"
                                    }
                                ]
                            }
                        }
                    },
                    "anycast-gw": {
                        "virtual-router-id": 1
                    }
                }
            ]
        }
      operation: Create
      path: .interface{.name=="irb0"}
  endpointSelector:
    - eda.nokia.com/role=leaf
  operatingSystem: srl
  priority: 10
  version: 25.7.1
---
# configlet to tie the IRB to the GRT
apiVersion: config.eda.nokia.com/v1alpha1
kind: Configlet
metadata:
  labels:
    role: hackathon-infra
  name: netinst-default-irb0.1
  namespace: eda
spec:
  configs:
    - config: |-
        {
            "interface": [
                {
                    "name": "irb0.1"
                }
            ]
        }
      operation: Create
      path: .network-instance{.name=="default"}
  endpointSelector:
    - eda.nokia.com/role=leaf
  operatingSystem: srl
  priority: 11
  version: 25.7.1
---
# configlet to tie the IRB to MACVRF-1
apiVersion: config.eda.nokia.com/v1alpha1
kind: Configlet
metadata:
  labels:
    role: hackathon-infra
  name: netinst-macvrf1-irb0.1
  namespace: eda
spec:
  configs:
    - config: |-
        {
            "interface": [
                {
                    "name": "irb0.1"
                }
            ]
        }
      operation: Create
      path: .network-instance{.name=="macvrf1"}
  endpointSelector:
    - eda.nokia.com/role=leaf
  operatingSystem: srl
  priority: 11
  version: 25.7.1

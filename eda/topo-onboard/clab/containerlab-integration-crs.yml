# --- MANAGEMENT ROUTER ---
# ---
# apiVersion: bootstrap.eda.nokia.com/v1alpha1
# kind: ManagementRouter
# metadata:
#   name: mgmt
#   namespace: eda
#   labels:
#     role: hackathon-infra
# spec:
#   nodeSelector:
#     - eda.nokia.com/role=leaf
#     - eda.nokia.com/role=spine

# --- EDA DISCOVERY GRPC SERVER ---
# this configlet adds eda-discovery grpc server
# so in case we need to redeploy EDA after it onboarded nodes
# and removed the discovery grpc server
# this configlet will adds it back and makes it possible to
# rediscover previously onboarded nodes
apiVersion: config.eda.nokia.com/v1
kind: Configlet
metadata:
  name: eda-discovery
  namespace: eda
  labels:
    role: hackathon-infra
spec:
  endpointSelectors:
    - containerlab=managed
  operatingSystem: srl
  configs:
    - path: .system.grpc-server{.name=="eda-discovery"}
      operation: Create
      config: |-
        {
          "name": "eda-discovery",
          "admin-state": "enable",
          "rate-limit": 65535,
          "session-limit": 1024,
          "metadata-authentication": true,
          "default-tls-profile": true,
          "network-instance": "mgmt",
          "port": 50052,
          "services": [
            "gnmi",
            "gnsi"
          ]
        }
---

# --- EDA COMMON SYSLOG SERVER ---
# considering we don't have a way (yet) to configure a
# common syslog server, this makes sure the hackathon
# syslog server is applied on all EDA managed devices
apiVersion: config.eda.nokia.com/v1
kind: Configlet
metadata:
  name: syslog-mgmt
  namespace: eda
  labels:
    role: hackathon-infra
spec:
  endpointSelectors:
    - containerlab=managed
  operatingSystem: srl
  configs:
    - path: .system.logging
      operation: Create
      config: |-
        {
          "network-instance": "mgmt",
          "remote-server": [
            {
              "host": "10.128.${INSTANCE_ID}.75",
              "transport": "udp",
              "remote-port": 1514,
              "facility": [
                {
                  "facility-name": "local6",
                  "priority": {
                    "match-above": "informational"
                  }
                }
              ]
            }
          ]
        }
---

# --- DEFAULT MTU ---
apiVersion: siteinfo.eda.nokia.com/v1
kind: DefaultMTU
metadata:
  name: ip-mtu
  namespace: eda
spec:
  layer3MTU: 9198
  nodeSelectors:
    - containerlab=managed
# --- ARTIFACTS ---
apiVersion: artifacts.eda.nokia.com/v1
kind: Artifact
metadata:
  name: clab-srlinux-26.7.2
  namespace: eda-system
spec:
  filePath: srlinux-26.7.2.zip
  remoteFileUrl:
    fileUrl: "https://github.com/nokia-eda/schema-profiles/releases/download/nokia-srl-26.7.2/srlinux-26.7.2-519.zip"
  repo: clab-schemaprofiles
---
apiVersion: artifacts.eda.nokia.com/v1
kind: Artifact
metadata:
  name: clab-llm-db-srlinux-26.7.2
  namespace: eda-system
spec:
  filePath: llm-embeddings-srl-26-7-2.tar.gz
  remoteFileUrl:
    fileUrl: "https://github.com/nokia-eda/llm-embeddings/releases/download/nokia-srl-26.7.2/llm-embeddings-srl-26-7-2-v1.tar.gz"
  repo: clab-llm-dbs
---

# --- INIT ---
apiVersion: bootstrap.eda.nokia.com/v1
kind: Init
metadata:
  name: init-base
  namespace: eda
  labels:
    role: hackathon-infra
spec:
  commitSave: true
  mgmt:
    staticRoutes:
      - nextHop: 10.128.${INSTANCE_ID}.1
        prefix: 0.0.0.0/0
  nodeSelectors:
    - containerlab=managed
---

# --- NODE-USER-GROUP ---
apiVersion: aaa.eda.nokia.com/v1
kind: NodeGroup
metadata:
  name: sudo
  namespace: eda
spec:
  rules: []
  services:
    - GNMI
    - CLI
    - NETCONF
    - GNOI
    - GNSI
  superuser: true
---

# --- NODE-USER ---
apiVersion: core.eda.nokia.com/v1
kind: NodeUser
metadata:
  name: admin
  namespace: eda
  labels:
    role: hackathon-infra
spec:
  username: admin
  password: ${EVENT_PASSWORD}
  groupBindings:
    - groups:
        - sudo
      nodeSelector:
        - containerlab=managed
  sshPublicKeys:
    - ${SSH_PUBLIC_KEY}
---

# --- NODE-PROFILES ---
apiVersion: core.eda.nokia.com/v1
kind: NodeProfile
metadata:
  name: hackathon-srlinux-26.7.2
  namespace: eda
  labels:
    role: hackathon-infra
spec:
  port: 57410
  annotate: true
  operatingSystem: srl
  version: 26.7.2
  versionPath: .system.information.version
  versionMatch: v26\.7\.2.*
  llmDb: https://eda-asvr.eda-system.svc/_base_/clab-llm-dbs/clab-llm-db-srlinux-26.7.2/llm-embeddings-srl-26-7-2.tar.gz
  yang: https://eda-asvr.eda-system.svc/_base_/clab-schemaprofiles/clab-srlinux-26.7.2/srlinux-26.7.2.zip
  nodeUser: admin
  onboardingPassword: NokiaSrl1!
  onboardingUsername: admin
  images:
    - image: fake.bin
      imageMd5: fake.bin.md5
  containerImage: ghcr.io/nokia/srlinux:26.7.2-519
  imagePullSecret: core
  license: cx-srl-26-7-1-ghcr-license
---

